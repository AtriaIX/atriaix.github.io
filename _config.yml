title: AtriaIX
handle: "@AtriaIX"
tagline: "Reverse Engineer"
description: >-
  Reverse engineering and nice CTF writeups by Atria.
author: Atria


avatar: "assets/images/avatar.jpg"
favicon: "/assets/images/wizard-hat.png"


url: "https://AtriaIX.github.io"
baseurl: ""

social:
  github: "https://github.com/AtriaIX"
  discord: "https://discord.com/users/1435697323547033741"
  linkedin: "https://www.linkedin.com/in/atriaix"
  medium: "https://medium.com/@AtriaIX"
  x: "https://x.com/AtriaIX"
  pwncollege: "https://pwn.college/hacker/AtriaIX"
  pwncollege_icon: ""

categories_list:
  - name: "CTF Write-Ups"
    url: /write-ups/
  - name: "Labs"
    url: /labs/
  - name: "Malware"
    url: /malware/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/
collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
